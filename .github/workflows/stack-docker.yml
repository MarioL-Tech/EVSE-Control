name: Unified stack and archive drift (isolated Docker)
on:
  push:
    paths: ['bin/**', 'tests/stack/**', 'docs/stack.md', 'rasppi/**/compose*.yaml', 'rasppi/compose.yaml', 'rasppi/weboverlay/php/*History*.php', 'rasppi/weboverlay/public/index.php', 'rasppi/weboverlay/tests/history-init.sql', 'rasppi/storage/migrations/**', '.github/workflows/stack-docker.yml']
  pull_request:
    paths: ['bin/**', 'tests/stack/**', 'docs/stack.md', 'rasppi/**/compose*.yaml', 'rasppi/compose.yaml', 'rasppi/weboverlay/php/*History*.php', 'rasppi/weboverlay/public/index.php', 'rasppi/weboverlay/tests/history-init.sql', 'rasppi/storage/migrations/**', '.github/workflows/stack-docker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Installed one-shot systemd unit and pinned-endpoint races on disposable Docker
        run: bash tests/stack/archive-boot-ci.sh
      - name: Redacted boot-helper diagnostics on failure
        if: failure()
        run: |
          sudo systemctl show evse-archive-link.service -p Result -p ExecMainCode -p ExecMainStatus
          sudo journalctl -b -u evse-archive-link.service --no-pager -o cat | grep -E '^Archiv-Netz:|: (docker|setpriv|bash): command not found$' | tail -20 || :
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Real separate Compose projects, external fixture DB/broker, restart and lost network endpoint
        run: bash tests/stack/isolated-ci.sh
