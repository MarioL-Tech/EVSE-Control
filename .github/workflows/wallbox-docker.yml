name: Wallbox Docker tests
on:
  push:
    paths:
      - 'rasppi/wallbox/**'
      - '.github/workflows/wallbox-docker.yml'
  pull_request:
    paths:
      - 'rasppi/wallbox/**'
      - '.github/workflows/wallbox-docker.yml'
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and run isolated tests inside Docker
        run: docker build --progress=plain -t evse-wallbox:test rasppi/wallbox
      - name: Runtime dependencies and entrypoint smoke test
        run: docker run --rm evse-wallbox:test --help
