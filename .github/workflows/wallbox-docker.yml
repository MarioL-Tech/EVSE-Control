name: Wallbox Docker tests
on:
  push:
    paths:
      - 'rasppi/wallbox/**'
      - '.github/workflows/wallbox-docker.yml'
  pull_request:
    paths:
      - 'rasppi/wallbox/**'
      - '.github/workflows/wallbox-docker.yml'
permissions:
  contents: read
jobs:
  docker:
    name: docker (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - debian: bookworm
            runner: ubuntu-latest
            label: bookworm
            arch: x86_64
          - debian: trixie
            runner: ubuntu-latest
            label: trixie
            arch: x86_64
          - debian: bookworm
            runner: ubuntu-24.04-arm
            label: bookworm-arm64
            arch: aarch64
          - debian: trixie
            runner: ubuntu-24.04-arm
            label: trixie-arm64
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Build and run isolated tests inside Docker
        run: docker build --progress=plain --build-arg DEBIAN_RELEASE=${{ matrix.debian }} -t evse-wallbox:test rasppi/wallbox
      - name: Runtime dependencies and entrypoint smoke test
        run: |
          docker run --rm --env LD_BIND_NOW=1 evse-wallbox:test --help
          test "$(docker run --rm --entrypoint uname evse-wallbox:test -m)" = "${{ matrix.arch }}"
      - name: Runtime has no test probe or direct CLI write interface
        run: |
          docker run --rm --entrypoint sh evse-wallbox:test -ec '
            test ! -e /usr/local/bin/wallbox-write-probe
            test ! -e /src/build/wallbox-write-probe
            for option in --enable-writes --write --set-current-ma --start --stop; do
              set +e
              /usr/local/bin/evse-wallbox "$option" >/tmp/out 2>/tmp/err
              code=$?
              set -e
              test "$code" -eq 2
              test ! -s /tmp/out
              grep -q "Unknown option" /tmp/err
            done
          '
