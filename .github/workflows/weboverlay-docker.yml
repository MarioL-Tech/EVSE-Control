name: Weboverlay Docker tests
on:
  push:
    paths:
      - 'rasppi/weboverlay/**'
      - 'rasppi/storage/**'
      - '.github/workflows/weboverlay-docker.yml'
  pull_request:
    paths:
      - 'rasppi/weboverlay/**'
      - 'rasppi/storage/**'
      - '.github/workflows/weboverlay-docker.yml'
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose
        env:
          HISTORY_DB_PASSWORD_HOST_FILE: /tmp/isolated-history-reader-password
          MQTT_PASSWORD_HOST_FILE: /tmp/isolated-mqtt-password
        run: |
          docker compose -f rasppi/weboverlay/compose.yaml config --quiet
          docker compose -f rasppi/weboverlay/compose.yaml -f rasppi/weboverlay/compose.history.yaml config --quiet
          docker compose -f rasppi/weboverlay/compose.yaml -f rasppi/weboverlay/compose.auth.yaml -f rasppi/weboverlay/compose.history.yaml config --quiet
          COMPOSE_PROFILES=https WEB_BIND_ADDRESS=192.0.2.10 docker compose -f rasppi/weboverlay/compose.yaml -f rasppi/weboverlay/compose.auth.yaml -f rasppi/weboverlay/compose.history.yaml config --quiet
          docker compose -f rasppi/weboverlay/compose.pwa-test.yaml --profile tools config --quiet
          docker compose -f rasppi/weboverlay/compose.house-api-test.yaml config --quiet
          docker compose -f rasppi/weboverlay/compose.house-e2e-test.yaml config --quiet
          # Check actual expanded host bindings without publishing any test ports
          # or logging environment/credentials from the full configuration.
          env -u WEB_BIND_ADDRESS docker compose -f rasppi/weboverlay/compose.yaml config --format json | grep -Eq '"host_ip"[[:space:]]*:[[:space:]]*"127\.0\.0\.1"'
          WEB_BIND_ADDRESS=192.0.2.10 docker compose -f rasppi/weboverlay/compose.yaml -f rasppi/weboverlay/compose.history.yaml config --format json | grep -Eq '"host_ip"[[:space:]]*:[[:space:]]*"192\.0\.2\.10"'
          WEB_BIND_ADDRESS=192.0.2.10 docker compose -f rasppi/weboverlay/compose.yaml -f rasppi/weboverlay/compose.auth.yaml -f rasppi/weboverlay/compose.history.yaml config --format json | grep -Eq '"host_ip"[[:space:]]*:[[:space:]]*"192\.0\.2\.10"'
      - name: Build disposable browser test image
        run: docker build -f rasppi/weboverlay/Dockerfile.browser -t evse-web-browser:test rasppi/weboverlay
      - name: Render PWA product icons in disposable Docker image
        run: |
          mkdir -p artifacts/pwa-icons
          docker run --rm --network none -v "$PWD/artifacts/pwa-icons:/icons" evse-web-browser:test node generate-icons.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: evse-pwa-product-icons
          path: artifacts/pwa-icons/
      - name: Check committed icon provenance
        run: |
          for icon in app-192.png app-512.png app-maskable-512.png apple-touch-icon.png; do
            cmp "artifacts/pwa-icons/$icon" "rasppi/weboverlay/static/$icon"
          done
      - name: Build and test in Docker with isolated broker
        run: docker build --progress=plain -t evse-weboverlay:test rasppi/weboverlay
      - name: Build local HTTPS proxy
        run: docker build --progress=plain -f rasppi/weboverlay/docker/https/Dockerfile -t evse-web-https:test rasppi/weboverlay
      - name: Trusted HTTPS and PWA with isolated CA and broker
        working-directory: rasppi/weboverlay
        env:
          PWA_TEST_CA_DIR: ${{ runner.temp }}/evse-pwa-public-ca
        run: |
          mkdir -p "$PWA_TEST_CA_DIR" ../../artifacts/pwa
          # Test browser drops all capabilities, including root's DAC override:
          # only this disposable screenshot directory is writable by its UID.
          chmod 0777 ../../artifacts/pwa
          trap 'docker compose -f compose.pwa-test.yaml logs --tail 60 weboverlay https; docker compose -f compose.pwa-test.yaml --profile tools down --volumes' EXIT
          docker compose -f compose.pwa-test.yaml up -d --wait weboverlay https
          sh tests/https-integration.sh
          docker compose -f compose.pwa-test.yaml cp https:/data/caddy/pki/authorities/local/root.crt "$PWA_TEST_CA_DIR/root.crt"
          chmod 644 "$PWA_TEST_CA_DIR/root.crt"
          sh tests/run-pwa-integration.sh
      - name: Raw and calendar archive history with isolated MariaDB 11.8.8
        working-directory: rasppi/weboverlay
        run: |
          trap 'docker compose -f compose.history-test.yaml logs --tail 60; docker compose -f compose.history-test.yaml down --volumes' EXIT
          docker compose -f compose.history-test.yaml build history-tests
          docker compose -f compose.history-test.yaml up --abort-on-container-exit --exit-code-from history-tests
      - name: HOUSE read-only API with disposable loopback MariaDB 11.8.8
        working-directory: rasppi/weboverlay
        run: |
          project="evse-house-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker compose -p "$project" -f compose.house-api-test.yaml down --volumes --remove-orphans' EXIT
          docker compose -p "$project" -f compose.house-api-test.yaml up --build --abort-on-container-exit --exit-code-from house-api-tests
      - name: Direct HOUSE HTTP and Wallbox MQTT in existing storage runtime
        working-directory: rasppi/weboverlay
        run: |
          project="evse-house-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker compose -p "$project" -f compose.house-e2e-test.yaml logs --tail 60 collector; docker compose -p "$project" -f compose.house-e2e-test.yaml down --volumes --remove-orphans' EXIT
          docker compose -p "$project" -f compose.house-e2e-test.yaml build
          # Complete one-shot migration before attaching the assertion runner:
          # --abort-on-container-exit must not treat migrate's success as test end.
          docker compose -p "$project" -f compose.house-e2e-test.yaml up -d --wait --wait-timeout 90 collector
          docker compose -p "$project" -f compose.house-e2e-test.yaml run --rm --no-deps -T assertions
          # Real broker outage, controlled only by CI host. No Docker socket in
          # any helper container and no restart of the default storage runtime.
          collector=$(docker compose -p "$project" -f compose.house-e2e-test.yaml ps -q collector)
          docker compose -p "$project" -f compose.house-e2e-test.yaml stop broker
          docker compose -p "$project" -f compose.house-e2e-test.yaml run --rm --no-deps -T assertions broker-outage
          docker compose -p "$project" -f compose.house-e2e-test.yaml up -d --wait --wait-timeout 60 broker
          docker compose -p "$project" -f compose.house-e2e-test.yaml run --rm --no-deps -T assertions recovery
          test "$collector" = "$(docker compose -p "$project" -f compose.house-e2e-test.yaml ps -q collector)"
          test "$(docker inspect -f '{{.RestartCount}}' "$collector")" = 0
          # init + one Python runtime; HOUSE polling must be a thread, not a
          # second --house collector or PHP publisher process.
          docker compose -p "$project" -f compose.house-e2e-test.yaml exec -T collector python /app/tests/process_assertions.py
          docker compose -p "$project" -f compose.house-e2e-test.yaml stop -t 20 collector
          test "$(docker inspect -f '{{.State.ExitCode}}' "$collector")" = 0
          test "$(docker inspect -f '{{.State.OOMKilled}}' "$collector")" = false
      - name: Extract resolved Composer lock for verification
        run: |
          docker create --name web-dependencies evse-weboverlay:test
          docker cp web-dependencies:/app/composer.lock ./composer.lock
          docker rm web-dependencies
          cmp rasppi/weboverlay/composer.lock composer.lock
      - uses: actions/upload-artifact@v4
        with:
          name: weboverlay-composer-lock
          path: composer.lock
      - name: Hardened runtime smoke test without broker
        run: |
          docker run -d --name web-smoke --read-only --tmpfs /tmp:size=16m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --network none evse-weboverlay:test
          trap 'docker logs web-smoke; docker rm -f web-smoke' EXIT
          ready=0
          for attempt in $(seq 1 20); do
            if docker exec web-smoke php -r '$d=json_decode(file_get_contents("http://127.0.0.1:8080/api/state"), true, 64, JSON_THROW_ON_ERROR); exit($d["values"] === null && $d["status"] === "offline" ? 0 : 1);'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker exec web-smoke php -r '$d=json_decode(file_get_contents("http://127.0.0.1:8080/api/history"), true, 64, JSON_THROW_ON_ERROR); exit($d["read_only"] === true && $d["status"] === "disabled" && $d["samples"] === [] ? 0 : 1);'
          ! docker exec web-smoke sh -c 'command -v python || command -v python3'
          docker run --rm --network container:web-smoke -v "$PWD/artifacts:/artifacts" evse-web-browser:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weboverlay-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
