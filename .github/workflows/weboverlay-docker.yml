name: Weboverlay Docker tests
on:
  push:
    paths:
      - 'rasppi/weboverlay/**'
      - 'rasppi/storage/migrations/**'
      - 'rasppi/storage/storage/history.py'
      - '.github/workflows/weboverlay-docker.yml'
  pull_request:
    paths:
      - 'rasppi/weboverlay/**'
      - 'rasppi/storage/migrations/**'
      - 'rasppi/storage/storage/history.py'
      - '.github/workflows/weboverlay-docker.yml'
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose
        env:
          HISTORY_DB_PASSWORD_HOST_FILE: /tmp/isolated-history-reader-password
          MQTT_PASSWORD_HOST_FILE: /tmp/isolated-mqtt-password
        run: |
          docker compose -f rasppi/weboverlay/compose.yaml config --quiet
          docker compose -f rasppi/weboverlay/compose.yaml -f rasppi/weboverlay/compose.history.yaml config --quiet
          docker compose -f rasppi/weboverlay/compose.yaml -f rasppi/weboverlay/compose.auth.yaml -f rasppi/weboverlay/compose.history.yaml config --quiet
          # Check actual expanded host bindings without publishing any test ports
          # or logging environment/credentials from the full configuration.
          env -u WEB_BIND_ADDRESS docker compose -f rasppi/weboverlay/compose.yaml config --format json | grep -Eq '"host_ip"[[:space:]]*:[[:space:]]*"127\.0\.0\.1"'
          WEB_BIND_ADDRESS=192.0.2.10 docker compose -f rasppi/weboverlay/compose.yaml -f rasppi/weboverlay/compose.history.yaml config --format json | grep -Eq '"host_ip"[[:space:]]*:[[:space:]]*"192\.0\.2\.10"'
          WEB_BIND_ADDRESS=192.0.2.10 docker compose -f rasppi/weboverlay/compose.yaml -f rasppi/weboverlay/compose.auth.yaml -f rasppi/weboverlay/compose.history.yaml config --format json | grep -Eq '"host_ip"[[:space:]]*:[[:space:]]*"192\.0\.2\.10"'
      - name: Build and test in Docker with isolated broker
        run: docker build --progress=plain -t evse-weboverlay:test rasppi/weboverlay
      - name: Build disposable browser test image
        run: docker build -f rasppi/weboverlay/Dockerfile.browser -t evse-web-browser:test rasppi/weboverlay
      - name: Raw and calendar archive history with isolated MariaDB 11.8.8
        working-directory: rasppi/weboverlay
        run: |
          trap 'docker compose -f compose.history-test.yaml logs --tail 60; docker compose -f compose.history-test.yaml down --volumes' EXIT
          docker compose -f compose.history-test.yaml build history-tests
          docker compose -f compose.history-test.yaml up --abort-on-container-exit --exit-code-from history-tests
      - name: Extract resolved Composer lock for verification
        run: |
          docker create --name web-dependencies evse-weboverlay:test
          docker cp web-dependencies:/app/composer.lock ./composer.lock
          docker rm web-dependencies
          cmp rasppi/weboverlay/composer.lock composer.lock
      - uses: actions/upload-artifact@v4
        with:
          name: weboverlay-composer-lock
          path: composer.lock
      - name: Hardened runtime smoke test without broker
        run: |
          docker run -d --name web-smoke --read-only --tmpfs /tmp:size=16m,mode=1777 --cap-drop ALL --security-opt no-new-privileges --network none evse-weboverlay:test
          trap 'docker logs web-smoke; docker rm -f web-smoke' EXIT
          ready=0
          for attempt in $(seq 1 20); do
            if docker exec web-smoke php -r '$d=json_decode(file_get_contents("http://127.0.0.1:8080/api/state"), true, 64, JSON_THROW_ON_ERROR); exit($d["values"] === null && $d["status"] === "offline" ? 0 : 1);'; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker exec web-smoke php -r '$d=json_decode(file_get_contents("http://127.0.0.1:8080/api/history"), true, 64, JSON_THROW_ON_ERROR); exit($d["read_only"] === true && $d["status"] === "disabled" && $d["samples"] === [] ? 0 : 1);'
          ! docker exec web-smoke sh -c 'command -v python || command -v python3'
          docker run --rm --network container:web-smoke -v "$PWD/artifacts:/artifacts" evse-web-browser:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weboverlay-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
