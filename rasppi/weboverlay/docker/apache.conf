ServerRoot /etc/apache2
DefaultRuntimeDir /tmp
PidFile /tmp/evse-apache.pid
Mutex file:/tmp default
Listen ${EVSE_HTTP_PORT}
ServerName localhost
User #10001
Group #10001
ErrorLog /proc/self/fd/2
LogLevel warn
IncludeOptional mods-enabled/*.load
IncludeOptional mods-enabled/*.conf
Include conf-enabled/docker-php.conf
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 4
    MaxRequestWorkers 8
    MaxConnectionsPerChild 1000
</IfModule>
DocumentRoot /app/public
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory /app/public>
    AllowOverride None
    Options None
    Require all granted
    DirectoryIndex index.php
    FallbackResource /index.php
</Directory>
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 10
KeepAlive On
KeepAliveTimeout 2
MaxKeepAliveRequests 100
LimitRequestBody 1024
<Location /api/settings-env>
    LimitRequestBody 65536
</Location>
