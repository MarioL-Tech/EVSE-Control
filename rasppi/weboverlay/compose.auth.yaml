services:
  house-publisher:
    environment:
      MQTT_PASSWORD: ""
      MQTT_PASSWORD_FILE: /run/secrets/mqtt-password
    volumes:
      - "${HOUSE_MQTT_PASSWORD_HOST_FILE:-${MQTT_PASSWORD_HOST_FILE:?Set an existing password file readable by container UID 10001}}:/run/secrets/mqtt-password:ro"
  weboverlay:
    environment:
      MQTT_PASSWORD: ""
      MQTT_PASSWORD_FILE: /run/secrets/mqtt-password
    volumes:
      - "${MQTT_PASSWORD_HOST_FILE:?Set an existing password file readable by container UID 10001}:/run/secrets/mqtt-password:ro"
