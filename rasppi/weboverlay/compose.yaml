services:
  weboverlay:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    environment:
      MQTT_HOST: "${MQTT_HOST:-mqtt-broker}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      MQTT_TOPIC_PREFIX: "${MQTT_TOPIC_PREFIX:-evse/wallbox}"
      ESP32_MQTT_TOPIC_PREFIX: "${ESP32_MQTT_TOPIC_PREFIX:-evse/esp32}"
      MQTT_CLIENT_ID: "${MQTT_CLIENT_ID:-evse-weboverlay}"
      MQTT_USERNAME: "${MQTT_USERNAME:-}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:-}"
      MQTT_PASSWORD_FILE: "${MQTT_PASSWORD_FILE:-}"
      WEB_STALE_SECONDS: "${WEB_STALE_SECONDS:-10}"
      WEB_HISTORY_ENABLED: "${WEB_HISTORY_ENABLED:-0}"
      WEB_HOUSE_HISTORY_ENABLED: "${WEB_HOUSE_HISTORY_ENABLED:-0}"
      HOUSE_HISTORY_SOURCE: "${HOUSE_HISTORY_SOURCE:-${HOUSE_MQTT_TOPIC_PREFIX:-evse/house}}"
      SMARTMETER_URL: "${SMARTMETER_URL:-}"
      SMARTMETER_POLL_SECONDS: "${SMARTMETER_POLL_SECONDS:-2}"
      SMARTMETER_TIMEOUT_SECONDS: "${SMARTMETER_TIMEOUT_SECONDS:-2}"
      SMARTMETER_STALE_SECONDS: "${SMARTMETER_STALE_SECONDS:-10}"
      SETTINGS_EDITOR_ENABLED: "${SETTINGS_EDITOR_ENABLED:-1}"
      SETTINGS_EDITOR_ORIGIN: "${SETTINGS_EDITOR_ORIGIN:-http://${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}}"
      WEB_CONTROL_ORIGIN: "${WEB_CONTROL_ORIGIN:-${SETTINGS_EDITOR_ORIGIN:-http://${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}}}"
    volumes:
      # Dedicated config-only tree. Never mount project/service/secret directories writable.
      # Until explicit setup-settings.sh provisioning the editor fails closed.
      - ../../.evse-settings:/run/evse-settings
    networks:
      - mqtt
      - web
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # Opt-in LAN HTTPS with a private CA; HTTP above stays available unchanged.
  # Start the whole enabled stack (no explicit service) when using this profile.
  https:
    profiles: [https]
    build:
      context: .
      dockerfile: docker/https/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      weboverlay:
        condition: service_healthy
    environment:
      EVSE_TLS_HOST: "${WEB_TLS_HOST:-${WEB_BIND_ADDRESS:-127.0.0.1}}"
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HTTPS_PORT:-443}:8443/tcp"
    networks:
      - web
    volumes:
      - https-data:/data
    read_only: true
    tmpfs:
      - /config:uid=10001,gid=10001,mode=0700,size=4m
      - /tmp:uid=10001,gid=10001,mode=0700,size=4m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  web:
    internal: true
  mqtt:
    external: true
    name: evse-mqtt
volumes:
  # Contains private CA keys. Export ONLY caddy/pki/authorities/local/root.crt.
  https-data:
