services:
  uart-bridge:
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.uart
    devices:
      - "${UART_DEVICE:-/dev/serial0}:/dev/serial0"
    stdin_open: true
    tty: true
    environment:
      UART_MODE: "${UART_MODE:-interactive}"
      MQTT_HOST: "${MQTT_HOST:-mqtt-broker}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      MQTT_USERNAME: "${MQTT_USERNAME:-}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:-}"
      MQTT_PASSWORD_FILE: "${MQTT_PASSWORD_FILE:-}"
      ESP32_MQTT_CLIENT_ID: "${ESP32_MQTT_CLIENT_ID:-evse-uart-gateway}"
      ESP32_MQTT_TOPIC_PREFIX: "${ESP32_MQTT_TOPIC_PREFIX:-evse/esp32}"
      WALLBOX_MQTT_TOPIC_PREFIX: "${WALLBOX_MQTT_TOPIC_PREFIX:-${MQTT_TOPIC_PREFIX:-evse/wallbox}}"
    # Interactive serial tooling must not require an MQTT network to exist.
    # Gateway operators explicitly select the already existing evse-mqtt network.
    network_mode: "${UART_NETWORK_MODE:-none}"
    stop_grace_period: 5s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m"]
